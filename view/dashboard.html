<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard &middot; Sistema de Gesti&oacute;n</title>
    <link rel="icon" href="data:;base64,=">
    <link rel="stylesheet" href="../estilos/theme.css">
    <link rel="stylesheet" href="../estilos/dashboard.css">
</head>
<body>

    <nav>
        <ul class="menu" id="menuPrincipal">
        </ul>
    </nav>

    <div class="barraSuperior" id="barraSuperior">
        <h2 id="tituloBienvenida">Cargando...</h2>
        <div class="fecha" id="fechaHoy"></div>
    </div>

    <div class="tarjetas" id="tarjetas">
    </div>

    <main class="contenido">
        <div class="panelSimple panelBienvenida">
            <p class="eyebrow" id="eyebrowPanel">Resumen</p>
            <h1>Panel de control</h1>
            <p id="textoPanel">Cargando tus accesos disponibles...</p>
        </div>

        <section class="seccionAccesos">
            <div class="encabezadoSeccion">
                <div>
                    <p class="eyebrow">Menu personalizado</p>
                    <h2>Tus accesos</h2>
                    <p class="descripcionSeccion">Opciones disponibles segun tu rol actual.</p>
                </div>
            </div>
            <div class="gridAccesos" id="accesosRapidos"></div>
        </section>
    </main>

    <script>
        const path = window.location.pathname;
        const idxView = path.indexOf("/view/");
        const idxProj = path.indexOf("/proyecto_pw_Sistema de Gesti&oacute;n_corregido");
        if (idxView !== -1) {
            window.BASE_URL = window.location.origin + path.slice(0, idxView + 1);
        } else if (idxProj !== -1) {
            window.BASE_URL = window.location.origin + path.slice(0, idxProj + "/proyecto_pw_Sistema de Gesti&oacute;n_corregido".length) + "/";
        }
    </script>
    <script src="js/dashboard.js?v=2"></script>
</body>

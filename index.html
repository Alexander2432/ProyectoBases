<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión</title>
    <link rel="icon" href="data:;base64,=">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0f17;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <iframe id="appFrame" src="view/index.html"></iframe>
    <script>
        const frame = document.getElementById("appFrame");
        
        // Al recargar, si existe una última página visitada en la sesión actual, la cargamos directamente
        const ultimoUrl = sessionStorage.getItem("ultimo_url");
        if (ultimoUrl) {
            frame.src = ultimoUrl;
        }
    </script>
</body>
</html>
